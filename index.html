<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Char Test</title>
  <style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Soft pastel sky blue to rose gradient matching your image */
    background: linear-gradient(135deg, #e1f2fb 0%, #f7e8f0 50%, #e3f6f0 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* Ethereal, dreamy glassmorphism UI overlay */
  .ui-overlay {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(255, 255, 255, 0.65);
    padding: 12px 24px;
    border-radius: 30px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 8px 32px rgba(180, 205, 230, 0.4),
                0 0 15px rgba(255, 255, 255, 0.8);
  }

  audio {
    height: 36px;
    outline: none;
    border-radius: 18px;
    filter: sepia(20%) hue-rotate(180deg) opacity(0.85); /* Blends default audio controls into pastel aesthetic */
  }
</style>

  <!-- ES Module Import Maps -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- WebGL Render Container -->
  <div id="canvas-container"></div>

  <!-- Audio Player Interface -->
  <div class="ui-overlay">
    <audio id="audio-player" src="./src/assets/audio/voiceover.mp3" controls></audio>
  </div>

  <!-- Main Entry Point -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
